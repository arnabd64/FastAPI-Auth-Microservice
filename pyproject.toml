[project]
name = "fastapi-auth-microservice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2,<0.143.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "python-multipart>=0.0.32,<0.0.33",
    "sqlmodel>=0.0.47,<0.0.48",
    "uvicorn[standard]>=0.54.0,<0.55.0",
]

[dependency-groups]
dev = [
    "isort>=9.0.2,<10.0.0",
    "ruff>=0.16.10,<0.17.0",
]


[tool.uv]
add-bounds = "major"
